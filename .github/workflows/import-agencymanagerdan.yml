name: Temporary source repository import

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: routehq-source-import
  cancel-in-progress: false

jobs:
  import:
    name: Copy AgencyManagerDan into RouteHQ
    runs-on: ubuntu-latest
    steps:
      - name: Check out RouteHQ
        uses: actions/checkout@v4
        with:
          ref: main
          path: destination

      - name: Check out the source application
        uses: actions/checkout@v4
        with:
          repository: IKAminu/AgencyManagerDan
          ref: main
          path: source
          persist-credentials: false

      - name: Copy application files, excluding repository and machine-specific files
        shell: bash
        run: |
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='dist/' \
            --exclude='build/' \
            --include='.env.example' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='.vercel/' \
            --exclude='.netlify/' \
            --exclude='.supabase/.temp/' \
            --exclude='.figma/design-context/' \
            --exclude='.plugins/' \
            --exclude='.opencode-skills/' \
            --exclude='*.log' \
            source/ destination/

      - name: Verify no local secrets or private key files were copied
        working-directory: destination
        shell: bash
        run: |
          set -euo pipefail
          prohibited="$(find . -type f \
            \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name 'id_rsa' -o -name 'id_ed25519' \) \
            ! -name '.env.example' \
            ! -path './.git/*' \
            -print -quit)"
          if [[ -n "$prohibited" ]]; then
            printf 'Prohibited file found: %s\n' "$prohibited"
            exit 1
          fi
          echo "Secret-file scan passed."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: destination/pnpm-lock.yaml

      - name: Install dependencies and verify the copied application
        working-directory: destination
        env:
          VITE_BASE_PATH: /
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm build

      - name: Push the verified import branch
        working-directory: destination
        shell: bash
        run: |
          set -euo pipefail
          IMPORT_BRANCH="import/agency-managerdan"
          git switch -C "$IMPORT_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to import. The existing branch is already up to date."
            exit 0
          fi
          git commit -m "Import AgencyManagerDan application baseline"
          git push --force origin "HEAD:refs/heads/$IMPORT_BRANCH"
          echo "Verified application copy pushed to $IMPORT_BRANCH."
