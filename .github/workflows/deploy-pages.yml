name: Deploy RouteHQ preview to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      source_branch:
        description: Branch to build for the preview
        required: true
        default: import/agency-managerdan
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: routehq-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out selected RouteHQ branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_branch }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript
        run: pnpm typecheck

      - name: Build preview
        run: pnpm build
        env:
          VITE_BASE_PATH: /RouteHQ/
          VITE_USE_MOCK_DATA: "true"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
